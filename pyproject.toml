[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifactu-keyflint-mcp"
version = "0.1.0"
description = "MCP server for Spanish invoicing compliance: audit VERI*FACTU fingerprint (huella) chains, generate the AEAT tax QR, and build/validate Facturae 3.2.2 invoices against the official XSD. Billed per call with KeyFlint credits."
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "ArceeDev" }]
keywords = ["mcp", "verifactu", "veri-factu", "aeat", "huella", "qr-tributario", "facturae", "face", "factura-electronica", "gestoria", "spain"]
dependencies = [
    "mcp>=2.0",
    "keyflint-verify[fast]>=1.2.0",
    "lxml>=5.0",
    "segno>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
verifactu-mcp = "verifactu_mcp.server:main"

[project.urls]
Homepage = "https://mcp.keyflint.dev"
Source = "https://github.com/ArceeDev/verifactu-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verifactu_mcp = ["schemas/*.xsd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
